install_depends:
  image: ${DOCKER_REG}/public/node:22.5-alpine3.19
  stage: 'install(依赖)'
  tags:
    - online
  only:
    refs:
      - deploy
    changes:
      - yarn.lock
  before_script:
    - source .gitlab/scripts/install.sh
  script:
    - npm_install
  cache:
    key: ${CI_BUILD_REF_NAME}
    paths:
      - node_modules/
      - .yarn
    policy: push
